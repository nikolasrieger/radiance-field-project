run:
  name: minipointnet_2dgs_n_full_0.05_l1_maxp_30_large

data:
  dataset_root: /mnt/hdd/lkuech/repos/radiance-field-project/data/uco3d_data_raw
  subset_lists_filename: /home/nrieger/radiance-field-project/set_lists_all-categories.sqlite
  num_supervision_views: 50
  num_workers: 4
  num_sequences: 30       # how many sequences to load into the Gaussian cache
  max_splats: 260000     # skip sequences with more splats than this
  max_points: 260000     # subsample Gaussians to at most this many per forward pass
  # Restrict to specific sequences for overfitting, or leave empty for full dataset.
  pick_sequences: []

model:
  model_type: minipointnet
  output_type: gs2d
  hidden_dim: 2048       # 2x wider than default (1024): encoder 128→512→1024→2048, decoder 1024→512→256

train:
  epochs: 1000
  lr: 1e-4
  optimizer: adamw
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 20
  ckpt_every: 100
  num_views_per_step: 4
  loss:
    type: l1
    normal_loss_type: cosine  # cosine or l1
    normal_region: full       # full or foreground
    recon_region: full        # full or foreground
    lambda_ssim: 0.0
    lambda_normal: 0.05
    lambda_depth: 0.0
