run:
  name: linprim
  seed: 42

data:
  dataset_root: /mnt/hdd/lkuech/repos/radiance-field-project/data/uco3d_data_raw
  subset_lists_filename: /home/nrieger/radiance-field-project/set_lists_all-categories.sqlite
  num_supervision_views: 30
  num_workers: 4
  num_sequences: 10       # how many sequences to load into the Gaussian cache
  max_splats: 260000     # skip sequences with more splats than this
  max_points: 260000     # subsample Gaussians to at most this many per forward pass
  # Restrict to specific sequences for overfitting, or leave empty for full dataset.
  pick_sequences: []

model:
  output_type: linprim
  encoder: [128, 256, 1024]   # PointNet++ SA stage output widths (length 3)
  decoder: [512, 256, 128]    # trunk MLP widths; last is head input dim
  # init_scale drives the default dist buffer: default_dist = init_scale * 2.6
  # (LinPrim octahedra cover 1/2.6 the volume of a Gaussian with the same sigma)
  init_scale: 0.01
  init_opacity: 0.1

train:
  epochs: 1000
  lr: 1e-3
  optimizer: adamw
  weight_decay: 0.0
  log_every: 50
  ckpt_every: 500
  grad_clip: 1.0
  loss:
    type: l2_masked
    lambda_ssim: 0.2
    lambda_normal: 0.0   # normal supervision not supported for linprim
    lambda_depth: 0.0
