run:
  name: minipointnet_2dgs_cos_full
  wandb_mode: online

data:
  dataset_root: /mnt/hdd/lkuech/repos/radiance-field-project/data/uco3d_data_raw
  subset_lists_filename: /home/nrieger/radiance-field-project/set_lists_all-categories.sqlite
  num_supervision_views: 10
  num_workers: 4
  num_sequences: 1       # how many sequences to load into the Gaussian cache
  max_splats: 260000     # skip sequences with more splats than this
  max_points: 150000     # subsample Gaussians to at most this many per forward pass
  # Restrict to specific sequences for overfitting, or leave empty for full dataset.
  pick_sequences: []

model:
  model_type: minipointnet
  output_type: gs2d

train:
  epochs: 300
  lr: 1e-4
  optimizer: adamw
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 50
  ckpt_every: 100
  loss:
    type: l2_masked
    normal_loss_type: cosine  # cosine or l1
    normal_region: full       # full or foreground
    recon_region: full        # full or foreground
    lambda_ssim: 0.2
    lambda_normal: 0.4
