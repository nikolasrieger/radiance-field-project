[project]
name = "radiance-field-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "gsplat>=1.5.3",
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "ipykernel>=7.2.0",
    "omegaconf>=2.3.0",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=3.0.2",
    "plyfile>=1.1.3",
    "requests>=2.33.1",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.49",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dataset_download"]

[project.scripts]
download-dataset = "dataset_download.download_dataset:main"
