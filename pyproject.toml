[project]
name = "radiance-field-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "gsplat>=1.5.3",
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "matplotlib>=3.10.9",
    "omegaconf>=2.3.0",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=3.0.2",
    "plyfile>=1.1.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.49",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "uco3d",
    "viser>=1.0.29",
    "wandb>=0.26.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
    "jupyterlab>=4.0.0", 
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radiance_field_project"]

[tool.uv.sources]
uco3d = { git = "https://github.com/facebookresearch/uco3d.git", rev = "b17b2afcd286d83cc1a31c2546c374bfb2e984f6" }

[project.scripts]
download-dataset = "radiance_field_project.data.dataset_download.download_dataset:main"
training = "radiance_field_project.training.train:main"
